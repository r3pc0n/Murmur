<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Murmur</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:         #1c1c1e;
    --text-pri:   rgba(255,255,255,0.92);
    --text-muted: rgba(255,255,255,0.4);
    --track:      rgba(255,255,255,0.08);
    --accent:     #C8922A;
    color-scheme: light dark;
  }
  [data-theme="light"] {
    --bg:         oklch(97% 0.005 60);
    --text-pri:   rgba(0,0,0,0.87);
    --text-muted: rgba(0,0,0,0.38);
    --track:      rgba(0,0,0,0.10);
    --accent:     #8B5820;
    color-scheme: light;
  }

  body {
    background: var(--bg);
    font-family: 'Segoe UI', system-ui, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    overflow: hidden;
    user-select: none;
  }

  .container {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0;
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 10px;
  }

  .logo-icon {
    display: flex;
    align-items: center;
    gap: 3px;
    height: 36px;
  }

  .logo-icon .bar {
    width: 4px;
    border-radius: 3px;
    background: var(--accent);
    animation: wave 2s ease-in-out infinite;
  }

  .logo-icon .bar:nth-child(1) { height: 10px; animation-delay: 0.00s; }
  .logo-icon .bar:nth-child(2) { height: 18px; animation-delay: 0.18s; }
  .logo-icon .bar:nth-child(3) { height: 28px; animation-delay: 0.36s; }
  .logo-icon .bar:nth-child(4) { height: 36px; animation-delay: 0.54s; }
  .logo-icon .bar:nth-child(5) { height: 28px; animation-delay: 0.36s; }
  .logo-icon .bar:nth-child(6) { height: 18px; animation-delay: 0.18s; }
  .logo-icon .bar:nth-child(7) { height: 10px; animation-delay: 0.00s; }

  @keyframes wave {
    0%, 100% { transform: scaleY(0.4); opacity: 0.5; }
    50%       { transform: scaleY(1);   opacity: 1;   }
  }

  .logo-text {
    font-size: 30px;
    font-weight: 700;
    color: var(--text-pri);
    letter-spacing: -0.02em;
  }

  .subtitle {
    font-size: 13px;
    color: var(--text-muted);
    margin-bottom: 28px;
    letter-spacing: 0.01em;
  }

  .bar-track {
    width: 220px;
    height: 3px;
    background: var(--track);
    border-radius: 99px;
    overflow: hidden;
  }

  .bar-fill {
    height: 100%;
    width: 40%;
    background: var(--accent);
    border-radius: 99px;
    animation: slide 1.4s ease-in-out infinite;
  }

  @keyframes slide {
    0%   { transform: translateX(-100%); }
    50%  { transform: translateX(150%); }
    100% { transform: translateX(350%); }
  }
</style>
<script>
  (function() {
    var mq = window.matchMedia('(prefers-color-scheme: light)');
    function apply(e) { document.documentElement.setAttribute('data-theme', e.matches ? 'light' : 'dark'); }
    apply(mq);
    mq.addEventListener('change', apply);
  })();
</script>
</head>
<body>
<div class="container">
  <div class="logo">
    <div class="logo-icon">
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
    </div>
    <span class="logo-text">Murmur</span>
  </div>
  <div class="subtitle" id="status">Loading speech model...</div>
  <div class="bar-track">
    <div class="bar-fill"></div>
  </div>
</div>
<script>
  function applyThemeOverrides(payload) {
    if (!payload.overrides) return;
    const root = document.documentElement;
    const o = payload.overrides;
    root.setAttribute('data-theme', payload.mode);
    if (o['--bg-surface']) root.style.setProperty('--bg', o['--bg-surface']);
    if (o['--text-pri'])   root.style.setProperty('--text-pri', o['--text-pri']);
    if (o['--text-muted']) root.style.setProperty('--text-muted', o['--text-muted']);
    if (o['--accent'])     root.style.setProperty('--accent', o['--accent']);
  }
  if (window.pywebview) {
    window.pywebview.api.get_theme().then(applyThemeOverrides);
    window.pywebview.api.get_status().then(s => {
      if (s) document.getElementById('status').textContent = s;
    });
  }
</script>
</body>
</html>
